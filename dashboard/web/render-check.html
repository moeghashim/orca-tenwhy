<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tenwhy / grid render check</title>
    <style>
      #err { position: fixed; left: 8px; bottom: 8px; margin: 0; font-size: 11px; color: #71717a; z-index: 1; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="portal"></div>
    <pre id="err">no-error-yet</pre>
    <script>
      (function () {
        const err = document.getElementById("err");
        window.addEventListener("error", (e) => {
          err.textContent = String((e && (e.error || e.message)) || e);
        });
        window.addEventListener("unhandledrejection", (e) => {
          err.textContent = String((e && e.reason) || e);
        });
      })();
    </script>
    <script type="module" src="/src/render-check.js"></script>
  </body>
</html>
